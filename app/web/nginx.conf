map $http_x_forwarded_proto $hsts_header {
  default "";
  https "max-age=31536000";
}

map $uri $loggable {
  default 1;
  ~^/v1/public/verifications/ 0;
}

log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log safe if=$loggable;
  add_header Strict-Transport-Security $hsts_header always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'geolocation=(self), camera=(), microphone=()' always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
