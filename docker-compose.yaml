name: ${COMPOSE_PROJECT_NAME:-ira_preregist}

x-server-environment: &server-environment
  NODE_ENV: production
  PORT: 3000
  TRUST_PROXY: ${TRUST_PROXY:-1}
  DATABASE_URL: postgresql://${POSTGRES_USER:-ira_preregist}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ira_preregist}
  DATABASE_SSL: 'false'
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
  WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set}
  IMPORT_STORAGE_DIR: /workspace/app/server/var/imports
  GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
  GOOGLE_GEOCODING_BASE_URL: ${GOOGLE_GEOCODING_BASE_URL:-https://maps.googleapis.com/maps/api/geocode/json}

x-server-defaults: &server-defaults
  image: ${COMPOSE_PROJECT_NAME:-ira_preregist}-server:local
  env_file:
    - ${COMPOSE_ENV_FILE:-.env}
  environment: *server-environment
  build:
    context: .
    dockerfile: app/server/Dockerfile

services:
  postgres:
    image: postgis/postgis:16-3.4
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'pg_stat_statements.track=all']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ira_preregist}
      POSTGRES_USER: ${POSTGRES_USER:-ira_preregist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ira_preregist} -d ${POSTGRES_DB:-ira_preregist}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *server-defaults
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *server-defaults
    environment:
      <<: *server-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
    command: ['node', 'dist/db/seed.js', '--if-missing']
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *server-defaults
    expose:
      - '3000'
    volumes:
      - prod_imports:/workspace/app/server/var/imports
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - '${API_PORT:-3000}:80'
    volumes:
      - ./deploy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  maintenance-worker:
    <<: *server-defaults
    environment:
      <<: *server-environment
      WORKER_ROLE: maintenance
    command: ['node', 'dist/worker.js']
    volumes:
      - prod_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  campaign-worker:
    <<: *server-defaults
    environment:
      <<: *server-environment
      WORKER_ROLE: campaign
    command: ['node', 'dist/worker.js']
    volumes:
      - prod_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  messaging-worker:
    <<: *server-defaults
    environment:
      <<: *server-environment
      WORKER_ROLE: messaging
    command: ['node', 'dist/worker.js']
    volumes:
      - prod_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  import-worker:
    <<: *server-defaults
    environment:
      <<: *server-environment
      WORKER_ROLE: import
    command: ['node', 'dist/worker.js']
    volumes:
      - prod_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/v1}
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_imports:
