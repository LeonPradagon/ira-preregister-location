map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $forwarded_proto $hsts_header {
  default "";
  https "max-age=31536000";
}

map $uri $loggable {
  default 1;
  ~^/v1/public/verifications/ 0;
}

log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  access_log /var/log/nginx/access.log safe if=$loggable;
  add_header Strict-Transport-Security $hsts_header always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'geolocation=(self), camera=(), microphone=()' always;

  location /v1/ {
    # Resolve the service again after Docker recreates the API container.
    resolver 127.0.0.11 valid=10s;
    set $api_backend http://api:3000;
    proxy_pass $api_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
