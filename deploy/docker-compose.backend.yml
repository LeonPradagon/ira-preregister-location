services:
  postgres:
    image: postgis/postgis:16-3.4
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exact_location}
      POSTGRES_USER: ${POSTGRES_USER:-exact_location}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exact_location} -d ${POSTGRES_DB:-exact_location}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - backend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment: &server_environment
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-exact_location}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-exact_location}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set}
      GPS_MAX_ACCURACY_METERS: ${GPS_MAX_ACCURACY_METERS:-30}
      HOME_RADIUS_METERS: ${HOME_RADIUS_METERS:-50}
      MAX_LOCATION_ATTEMPTS: ${MAX_LOCATION_ATTEMPTS:-5}
      MAX_REMINDERS_PER_SESSION: ${MAX_REMINDERS_PER_SESSION:-3}
      ADDRESS_SCORE_THRESHOLD: ${ADDRESS_SCORE_THRESHOLD:-0.90}
      AUTO_APPROVAL_ADDRESS_SCORE_THRESHOLD: ${AUTO_APPROVAL_ADDRESS_SCORE_THRESHOLD:-0.90}
      STREET_MATCH_THRESHOLD: ${STREET_MATCH_THRESHOLD:-0.90}
      ENABLE_CUSTOMER_OTP: ${ENABLE_CUSTOMER_OTP:-false}
      ENABLE_IRA_COVERAGE: ${ENABLE_IRA_COVERAGE:-false}
      ENABLE_TICKETING: ${ENABLE_TICKETING:-false}
      ENABLE_MANUAL_REVIEW: ${ENABLE_MANUAL_REVIEW:-true}
      ENABLE_AUTO_APPROVAL: ${ENABLE_AUTO_APPROVAL:-false}
      ENABLE_ADDRESS_EDIT: ${ENABLE_ADDRESS_EDIT:-true}
      ENABLE_REMINDERS: ${ENABLE_REMINDERS:-true}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-id}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_DAILY_SEND_LIMIT: ${WHATSAPP_DAILY_SEND_LIMIT:-10000}
      WHATSAPP_MIN_INTERVAL_MINUTES: ${WHATSAPP_MIN_INTERVAL_MINUTES:-60}
      WHATSAPP_CIRCUIT_MIN_ATTEMPTS: ${WHATSAPP_CIRCUIT_MIN_ATTEMPTS:-50}
      WHATSAPP_CIRCUIT_FAILURE_RATIO: ${WHATSAPP_CIRCUIT_FAILURE_RATIO:-0.3}
      WHATSAPP_CIRCUIT_COOLDOWN_MINUTES: ${WHATSAPP_CIRCUIT_COOLDOWN_MINUTES:-15}
      WHATSAPP_RATE_LIMIT_PER_SECOND: ${WHATSAPP_RATE_LIMIT_PER_SECOND:-2}
      GEOCODING_RATE_LIMIT_PER_SECOND: ${GEOCODING_RATE_LIMIT_PER_SECOND:-1}
      # 3 API + 2 campaign + 2 messaging + 2 maintenance + 1 import = 10 processes.
      # Keep the default at 5 (about 50 connections) and leave headroom for migrations/admin tools.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-15000}
      READ_COUNT_CACHE_TTL_SECONDS: ${READ_COUNT_CACHE_TTL_SECONDS:-30}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
      IMPORT_STORAGE_DIR: /workspace/app/server/var/imports
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-500}
      IMPORT_WORKER_CONCURRENCY: ${IMPORT_WORKER_CONCURRENCY:-1}
      COUNTER_RECONCILIATION_INTERVAL_SECONDS: ${COUNTER_RECONCILIATION_INTERVAL_SECONDS:-300}
      CAMPAIGN_PROCESSING_TIMEOUT_MINUTES: ${CAMPAIGN_PROCESSING_TIMEOUT_MINUTES:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_PUBLIC_MAX: ${RATE_LIMIT_PUBLIC_MAX:-120}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-300}
      RATE_LIMIT_WEBHOOK_MAX: ${RATE_LIMIT_WEBHOOK_MAX:-600}
      CAMPAIGN_DEFAULT_BATCH_SIZE: ${CAMPAIGN_DEFAULT_BATCH_SIZE:-1000}
      CAMPAIGN_DEFAULT_SEND_WINDOW_DAYS: ${CAMPAIGN_DEFAULT_SEND_WINDOW_DAYS:-7}
      CAMPAIGN_MATERIALIZATION_BATCH_SIZE: ${CAMPAIGN_MATERIALIZATION_BATCH_SIZE:-1000}
      CAMPAIGN_QUEUE_SCAN_LIMIT: ${CAMPAIGN_QUEUE_SCAN_LIMIT:-100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL must be set}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Production Super Admin}
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment: *server_environment
    expose:
      - "3000"
    volumes:
      - backend_imports:/workspace/app/server/var/imports
    deploy:
      replicas: 3
      update_config:
        order: start-first
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-3000}:80"
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment:
      <<: *server_environment
      WORKER_ROLE: maintenance
    command: ["node", "dist/worker.js"]
    volumes:
      - backend_imports:/workspace/app/server/var/imports
    deploy:
      replicas: 2
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  campaign-worker:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment:
      <<: *server_environment
      WORKER_ROLE: campaign
    command: ["node", "dist/worker.js"]
    volumes:
      - backend_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  messaging-worker:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment:
      <<: *server_environment
      WORKER_ROLE: messaging
    command: ["node", "dist/worker.js"]
    volumes:
      - backend_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  import-worker:
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    environment:
      <<: *server_environment
      WORKER_ROLE: import
    command: ["node", "dist/worker.js"]
    volumes:
      - backend_imports:/workspace/app/server/var/imports
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  backend_postgres_data:
  backend_redis_data:
  backend_imports:
